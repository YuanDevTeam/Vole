name: Build release artifacts

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to validate for a tagged release
        type: string
        default: ''

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system
  UV_PYTHON_DOWNLOADS: never
  VOLE_RELEASE_TAG: ${{ inputs.tag }}
  VOLE_RELEASE_REPOSITORY: ${{ github.repository }}

jobs:
  cli:
    name: CLI ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli-linux-amd64
            label: Linux amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux
            archive: vole-linux-amd64.gz
          - name: cli-linux-arm64
            label: Linux arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            platform: linux
            archive: vole-linux-arm64.gz
          - name: cli-windows-wintun-amd64
            label: Windows amd64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            platform: windows
            archive: vole-windows-amd64.zip
          - name: cli-windows-wintun-arm64
            label: Windows arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            platform: windows
            archive: vole-windows-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build perl pkg-config
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}-${{ hashFiles('scripts/src/vole_scripts/*.py', 'scripts/cmake/**', 'scripts/native/**') }}
          workspaces: ". -> target"
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR VOLE BORING AWS_LC LIBCLANG BINDGEN
          cache-bin: "false"
      - name: Build and package production CLI
        shell: bash
        env:
          VOLE_TARGET: ${{ matrix.target }}
          VOLE_GROUP: ${{ matrix.name }}
          VOLE_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          args=(build-cli --target "$VOLE_TARGET" --output "dist/release/$VOLE_GROUP")
          if [[ -n "$VOLE_RELEASE_TAG" ]]; then args+=(--tag "$VOLE_RELEASE_TAG"); fi
          # The CLI helper selects windows-wintun on MSVC, never UWP or FFI.
          uv run --project scripts --locked python -m vole_scripts.release "${args[@]}"
          test -f "dist/release/$VOLE_GROUP/$VOLE_ARCHIVE"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: vole-release-build-${{ matrix.name }}-${{ github.sha }}
          path: dist/release/${{ matrix.name }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  ffi:
    name: FFI ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ffi-android
            label: Android
            platform: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android,x86_64-linux-android
            target: ""
            backend: ""
            archive: vole-ffi-android.tar.gz
          - name: ffi-linux-amd64
            label: Linux amd64
            platform: linux
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            backend: ""
            archive: vole-ffi-linux-amd64.tar.gz
          - name: ffi-linux-arm64
            label: Linux arm64
            platform: linux
            runner: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            backend: ""
            archive: vole-ffi-linux-arm64.tar.gz
          - name: ffi-windows-wintun-amd64
            label: Windows amd64 (Wintun)
            platform: windows
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            backend: wintun
            archive: vole-ffi-windows-wintun-amd64.zip
          - name: ffi-windows-wintun-arm64
            label: Windows arm64 (Wintun)
            platform: windows
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            backend: wintun
            archive: vole-ffi-windows-wintun-arm64.zip
          - name: ffi-windows-uwp-amd64
            label: Windows amd64 (UWP)
            platform: windows
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            backend: uwp
            archive: vole-ffi-windows-uwp-amd64.zip
          - name: ffi-windows-uwp-arm64
            label: Windows arm64 (UWP)
            platform: windows
            runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            backend: uwp
            archive: vole-ffi-windows-uwp-arm64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Locked source
        run: cargo fetch --locked
      - name: Audit the official h2 dependency
        if: matrix.name == 'ffi-linux-amd64'
        run: uv run --project scripts --locked python -m vole_scripts.h2_source
      - name: Linux runner native dependencies
        if: matrix.platform == 'linux' || matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build perl pkg-config
      - name: Android toolchain
        if: matrix.platform == 'android'
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk_package="$("$sdkmanager" --list --channel=0 | awk -F '|' '
            NF == 1 { split($0, fields, " "); $1 = fields[1]; $2 = fields[2] }
            { gsub(/[[:space:]]/, "", $1); gsub(/[[:space:]]/, "", $2) }
            $1 ~ /^ndk[;\/]30\.[0-9]+\.[0-9]+$/ &&
              $2 ~ /^30\.[0-9]+\.[0-9]+$/ {
                sub(/^ndk\//, "ndk;", $1); print $1
              }
          ' | sort -Vu | tail -n 1)"
          test -n "$ndk_package" || { echo "Stable NDK r30 is unavailable" >&2; exit 1; }
          "$sdkmanager" --channel=0 "$ndk_package"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ndk_package#ndk;}" >> "$GITHUB_ENV"
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}-${{ hashFiles('scripts/src/vole_scripts/*.py', 'scripts/cmake/**', 'scripts/native/**') }}
          workspaces: ". -> target"
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR ANDROID_NDK_HOME VOLE BORING AWS_LC LIBCLANG BINDGEN
          cache-bin: "false"
      - name: Build and package production FFI
        shell: bash
        env:
          VOLE_PLATFORM: ${{ matrix.platform }}
          VOLE_TARGET: ${{ matrix.target }}
          VOLE_BACKEND: ${{ matrix.backend }}
          VOLE_GROUP: ${{ matrix.name }}
          VOLE_ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          args=(build-ffi --platform "$VOLE_PLATFORM" --output "dist/release/$VOLE_GROUP")
          if [[ -n "$VOLE_TARGET" ]]; then args+=(--target "$VOLE_TARGET"); fi
          if [[ -n "$VOLE_BACKEND" ]]; then args+=(--backend "$VOLE_BACKEND"); fi
          if [[ -n "$VOLE_RELEASE_TAG" ]]; then args+=(--tag "$VOLE_RELEASE_TAG"); fi
          uv run --project scripts --locked python -m vole_scripts.release "${args[@]}"
          test -f "dist/release/$VOLE_GROUP/$VOLE_ARCHIVE"
      - name: Check unpackaged Windows COM lifecycle
        if: matrix.platform == 'windows' && matrix.backend == 'uwp'
        shell: bash
        env:
          VOLE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$VOLE_TARGET" in
            x86_64-pc-windows-msvc) architecture=x64 ;;
            aarch64-pc-windows-msvc) architecture=arm64 ;;
            *) exit 1 ;;
          esac
          python scripts/check_windows_com.py --dll "dist/windows/$architecture/uwp/vole.dll"
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: vole-release-build-${{ matrix.name }}-${{ github.sha }}
          path: dist/release/${{ matrix.name }}/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  apple_build:
    name: Apple ${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            primary: aarch64-apple-darwin
            secondary: x86_64-apple-darwin
          - platform: iOS
            primary: aarch64-apple-ios
            secondary: aarch64-apple-ios-sim
          - platform: tvOS
            primary: aarch64-apple-tvos
            secondary: aarch64-apple-tvos-sim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        id: xcode
        with:
          xcode-version: latest-stable
      - name: Verify Rosetta for the macOS amd64 CLI
        if: matrix.platform == 'macOS'
        run: /usr/bin/arch -x86_64 /usr/bin/true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.primary }},${{ matrix.secondary }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          architecture: arm64
      - uses: astral-sh/setup-uv@v10.4.0
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-apple-${{ matrix.platform }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/src/vole_scripts/*.py', 'scripts/cmake/**', 'scripts/native/**') }}
          workspaces: ". -> target"
          env-vars: ImageOS ImageVersion SDKROOT DEVELOPER_DIR VOLE BORING AWS_LC LIBCLANG BINDGEN
          cache-bin: "false"
      - name: Build and package the macOS arm64 CLI
        if: matrix.platform == 'macOS'
        run: >-
          uv run --project scripts --locked python -m vole_scripts.release build-cli
          --target ${{ matrix.primary }} --output dist/release/cli-darwin-arm64
      - name: Build the primary static library
        run: >-
          uv run --project scripts --locked python -m vole_scripts.release build-apple-target
          --target ${{ matrix.primary }} --output dist/apple-targets/${{ matrix.primary }}
      - name: Build and package the macOS amd64 CLI
        if: matrix.platform == 'macOS'
        run: >-
          uv run --project scripts --locked python -m vole_scripts.release build-cli
          --target ${{ matrix.secondary }} --output dist/release/cli-darwin-amd64
      - name: Build the secondary static library
        run: >-
          uv run --project scripts --locked python -m vole_scripts.release build-apple-target
          --target ${{ matrix.secondary }} --output dist/apple-targets/${{ matrix.secondary }}
      - name: Upload Apple static libraries
        uses: actions/upload-artifact@v7
        with:
          name: vole-apple-${{ matrix.platform }}-${{ github.sha }}
          path: dist/apple-targets
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS arm64 CLI
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: vole-release-build-cli-darwin-arm64-${{ github.sha }}
          path: dist/release/cli-darwin-arm64/vole-darwin-arm64.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS amd64 CLI
        if: matrix.platform == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: vole-release-build-cli-darwin-amd64-${{ github.sha }}
          path: dist/release/cli-darwin-amd64/vole-darwin-amd64.gz
          if-no-files-found: error
          retention-days: 14

  apple:
    name: FFI Apple
    needs: apple_build
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
          architecture: arm64
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          pattern: vole-apple-*-${{ github.sha }}
          path: dist/apple-targets
          merge-multiple: true
      - name: Assemble and package XCFramework
        run: |
          uv run --project scripts --locked python -m vole_scripts.release assemble-apple \
            --inputs dist/apple-targets --output dist/release/ffi-apple
      - uses: actions/upload-artifact@v7
        with:
          name: vole-release-build-ffi-apple-${{ github.sha }}
          path: dist/release/ffi-apple/vole-ffi-apple.tar.gz
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble
    needs: [cli, ffi, apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          pattern: vole-release-build-*-${{ github.sha }}
          path: dist/release-incoming
      - name: Collect archives and write release notes
        shell: bash
        run: |
          set -euo pipefail
          args=(assemble --inputs dist/release-incoming --output dist/release-ready/assets
            --notes dist/release-ready/notes.md --repository "$VOLE_RELEASE_REPOSITORY")
          if [[ -n "$VOLE_RELEASE_TAG" ]]; then args+=(--tag "$VOLE_RELEASE_TAG"); fi
          uv run --project scripts --locked python -m vole_scripts.release "${args[@]}"
      - name: Upload release archives and notes
        uses: actions/upload-artifact@v7
        with:
          name: vole-release-ready-${{ github.sha }}
          path: |
            dist/release-ready/assets/*.gz
            dist/release-ready/assets/*.zip
            dist/release-ready/notes.md
          if-no-files-found: error
          retention-days: 14
