# Vole 配置的完整示例。
#
# 配置只接受本文列出的结构；未知或已移除的字段和自定义 tag 都会失败。支持 anchor、alias 和 YAML merge。
# 原始配置上限 8 MiB，展开预算 32 MiB，嵌套最多 64 层；递归 alias 失败。
# 顶层 port、socks-port、udp 和 listeners 都不接受；代理节点的 port / udp 仍有效。
#
# 库宿主先通过 Invoke API 调用 initialize({dataDir})，再通过 configYaml 内联
# 传入配置；CLI 使用 -f 指定文件，-d 指定数据目录，省略时读取数据目录下的 config.yaml。
# GeoData 固定由 Vole 管理在 dataDir/geodata 中；CLI 的 -t 只校验，不创建目录或联网。
# 所有平台均不设 GeoData 条数上限，不按数量截断，也不设总内存预算；
# 仅加载当前业务规则和 DNS policy 引用的分类/属性交集，详见 docs/geodata.md。

# IPv6 数据面总开关，省略时默认为 true。false 时拒绝 IPv6 字面量业务目标、过滤
# 本地解析和代理根节点的 IPv6 地址、禁止 IPv6 物理 socket，并在 TUN 入口丢弃
# IPv6 包。dns.ipv6 只有与本项同时为 true 时才生效。
ipv6: true

# mode 缺省 rule：顺序规则首条命中，未命中 DIRECT；global 使用 GLOBAL 组，direct 直连。
# log-level 缺省 info，还支持 debug、warning、error、silent；两字段值不区分大小写。
mode: rule
log-level: info

# unified-delay 默认 false；true 时复用探测连接再次发送 HEAD，成功时记录第二次耗时。
# profile.store-selected 默认 true，将 Controller 的显式选择保存到 dataDir/selected.json。
# 启动时缓存中的有效选择优先于 default-selected；成员已删除时使用配置默认/首成员。
# 文件损坏时使用配置；写入失败保留已生效选择，并在 Controller 状态中报告。
unified-delay: false
profile:
  store-selected: true
  store-fake-ip: false # true：dataDir/fake-ip.redb 持久化双向映射与分配位置

# 资源下载使用 global-ua（缺省 Vole/ 加 Core 版本）；etag-support 缺省 true。
# GeoData 字段独立可选；URL 缺省 MetaCubeX meta-rules-dat latest DAT。
# URL 以域名为主机、无 userinfo/fragment，生产构建使用 HTTPS。
# 自动更新默认 false；启动后仍获取缺失的必需资产。周期单位小时，默认 24，0 关闭周期检查。
global-ua: "Vole/0.1.0"
etag-support: true
geox-url:
  geoip: https://assets.example.com/geoip.dat
  geosite: https://assets.example.com/geosite.dat
geo-auto-update: true
geo-update-interval: 24

# 可选的 HTTP/SOCKS5 混合入口；mixed-port 省略或 0 时关闭，1–65535 时启用。
# TCP 在同端口接入 HTTP 转发 / CONNECT / Upgrade 和 SOCKS5 CONNECT / UDP ASSOCIATE。
# SOCKS5 UDP 随入口启用并绑定同端口，不提供独立入站 UDP 开关或 listeners 配置。
# 构建必须同时包含 inbound-http 和 inbound-socks5；缺少任一 feature 则拒绝启用入口。
# allow-lan 默认 false，绑定回环；true 时绑定通配地址，与 authentication 独立。
# ipv6: true 时同时绑定同端口 IPv6（v6-only）；false 时只监听 IPv4。
# authentication 省略或 [] 表示任何绑定地址均免认证；非空支持多个 user:password，
# 按首个冒号分隔，用户名 / 密码各 1–255 UTF-8 字节，HTTP/SOCKS5 共用。
# mixed-port 关闭时可以保留合法的 allow-lan 和 authentication，供之后启用入口使用。
# HTTP 逐请求认证、选路，支持流式正文 / 分块、Keep-Alive、CONNECT 与 Upgrade。
# 共享只适合可信网络，Basic 不加密链路；详细边界见 docs/inbounds.md#http。
# UDP 必须属于有效的 TCP 控制连接，源 IP/端口校验和资源上限见 inbounds.md#socks5。
mixed-port: 1080
allow-lan: false
bind-address: "*" # allow-lan=true 时可指定单个 IP
lan-allowed-ips: [0.0.0.0/0, "::/0"]
lan-disallowed-ips: [] # 拒绝优先
skip-auth-prefixes: [] # 仅跳过认证，仍执行来源访问控制
authentication:
  - "probe-user:probe-password"

# 可选的运行时 Controller，地址必须是回环 IP 和显式非零端口。它可服务于启用
# TUN 的配置或含 proxy-groups 的配置；运行配置仍需开启 mixed-port 或 TUN。
# 只要 Controller 管理 proxy-groups，secret 就必填；仅有 TUN 流量接口时可省略。
# secret 出现时必须为 1–255 UTF-8 字节，并作为全部 Controller 路由的 Bearer token。
# Controller 提供 GET /traffic、GET /group、GET /group/{name}、
# GET /proxies/{name} 和 PUT /proxies/{name}，不属于 Invoke API。
external-controller: 127.0.0.1:9090
secret: "vole-runtime-secret"

# TUN 使用 Mihomo 同名字段；auto-route/auto-detect-interface 仅供 Linux 自建 TUN。
# Linux 缺省均为 true，其他平台缺省 false；借用 fd 的网络配置始终由宿主负责。
# auto-redirect、自定义地址/路由、stack、offload 等字段仍严格拒绝。
# file-descriptor 缺省或 0 时由 core 打开本机平台 TUN；正数为当前进程已有 fd。
# Unix 借用 fd 必须已 nonblocking，核心仅复制并关闭副本；帧格式由平台固定处理。
# Linux / macOS 支持原生打开；Android / iOS / tvOS 仍要求宿主提供 fd。
# device 缺省为空：Linux / Wintun 使用 Vole，macOS 自动选择 utun；
# 借用 fd 时以真实接口为准，device 不重命名已有接口。
# mtu 缺省或 0 为 9000，范围 1280–65535，贯通设备、netstack 和 UDP 回包预算。
# 借用 Linux fd 的真实 MTU 必须匹配；其他宿主也须保持接口 MTU 与配置一致。
# Windows windows-wintun / windows-uwp feature 互斥；普通 Invoke 按编译后端启动。
# Wintun 仅加载进程可执行文件同目录的外置 wintun.dll，不下载或随包发布；
# 接口地址、DNS、路由与物理出口隔离由宿主配置。
# UWP 上限 1400，须显式配置可支持 MTU，不把默认 9000 静默截断。
# dns-hijack 缺省 [0.0.0.0:53]；[] 关闭。只在 dns.enable:true 的 TUN TCP/UDP 上生效。
# 精确 IP:port 匹配指定目标；any/未指定地址匹配任何地址族的 53 端口。
# udp-timeout 单位秒，缺省或 0 为 300；控制源关联及各目的流的空闲失效。
# 配置必须启用 mixed-port 或 TUN。
tun:
  # auto-route: true # Linux：自动路由；DNS 启用且劫持网关时接管 systemd-resolved
  # auto-detect-interface: true # Linux：出站自动绑定物理接口
  enable: true
  device: ""
  file-descriptor: 0
  mtu: 9000
  dns-hijack:
    - any:53
  udp-timeout: 300

# 可选的 TUN TCP/UDP 嗅探器。省略或 enable: false 表示关闭。启用时至少配置
# HTTP、TLS、QUIC 之一；协议值为空或省略 ports 时分别使用 80/443/443。每种协议
# 最多 64 个单端口或升序闭区间；HTTP 与 TLS 的 TCP 端口不能重叠，QUIC 使用
# UDP，可与二者使用相同端口。嗅探结果只参与选路，不改写实际目标。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8380]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

# proxies 可省略或设为 []，允许仅使用 DIRECT、REJECT 或只包含内置动作的代理组。
# 引用的节点和代理组必须存在。节点和代理组定义名共享同一大小写敏感的命名空间，
# 引用精确匹配且不做 Unicode normalization 或大小写折叠。名称必须为非空字符串；
# DIRECT、REJECT、REJECT-DROP、COMPATIBLE、PASS、PASS-RULE 为保留定义名。
# 路径与 URL 中的保留字符由调用方按相应协议编码，不限制节点本身的名称。
# dialer-proxy 可引用具体节点或 select 组。全部上游和组成员（包括未选成员）须无环。
# 代理数量和链深没有独立上限，仍受 YAML 大小与名称唯一约束。
# 实际建立物理首跳时才通过节点 resolver 解析主端点和独立下载端点。
# 未选节点的 DNS 失败不阻塞准备；DNS 关闭时才使用系统 resolver。
# DNS 开启时可通过 hosts 配置本机端点；关闭 DNS 或独立测速的系统 resolver
# 仍拒绝解析到回环的服务器域名，本机服务器可使用 IP 字面量。
#
# VLESS 子集：
# - type 固定 vless，network 默认 tcp，支持 tcp/ws/grpc/http/h2/xhttp，tls 默认 false；
#   TCP 支持明文或 TLS 1.2/1.3；XHTTP H1/H2 支持明文、TLS1.3 或 REALITY。
# - encryption 省略/空/none，或 mlkem768x25519plus.{native,xorpub,random}.{1rtt,0rtt}.<key>…；
#   key/padding 链、上限和恢复规则见 vless.md；该层独立于外层 TLS/传输。
#   flow 省略/空/xtls-rprx-vision；Vision 仅 TCP + TLS1.3/REALITY 或 Encryption，
#   packet-encoding 必须 xudp（即使 udp=false）；
# - servername 可省略（WS Host 去端口后优先于 server）；TCP alpn 默认空，
#   WS 默认 [http/1.1]，gRPC/H2 默认 [h2]；XHTTP [http/1.1] 选择 H1，
#   空或 H1/H2 列表选择 H2，仅 [h3] 选择 H3。H3 必须标准 TLS1.3 与受控 UDP，
#   不回退 H2。明文 XHTTP 的 alpn 仅选择版本，其余 TLS 专属字段仍拒绝。
#   详细语义见 docs/vless.md 和 docs/xhttp.md。
# - packet-encoding 默认 xudp；none 是显式 raw，packetaddr/packet 为 IP-only
#   地址帧。raw 固定首包目标；packetaddr 域名通过受控 DNS 解析。
# - TLS 省略 reality-opts；REALITY 必须提供 reality-opts.public-key，可选 short-id；
#   support-x25519mlkem768 默认 false；true 强制真实混合协商、不回退经典组。
#   true 只允许 client-fingerprint chrome 或未命名（省略/none/空串）；不改写模板。
# - xhttp-opts 请求字段与值域详见 docs/xhttp.md；mode 只接受
#   auto/packet-up/stream-up/stream-one；stream-one 不能与 download-settings 同用；
# - download-settings 一旦出现（包括 {}），就为下行 GET 创建独立的
#   独立传输/安全连接；上行 POST 仍走主连接，两者共用
#   XHTTP session ID，不进行第二次 VLESS 握手。两条请求最终必须由 CDN 或
#   反向代理汇聚到同一个服务端 XHTTP 处理器和会话存储。
# - download-settings 缺省叶字段继承；headers/reuse-settings/reality-opts/jls-opts/ech-opts 整对象
#   替换，{} 分别清空请求头、重置复用默认、清除 REALITY/JLS/ECH。false/空串不等同缺省；
#   certificate/private-key 成对替换或同时空串清除。改变安全类型须显式清除冲突
#   策略。两个独立 listener 不能组成共享会话。
#   auto 为 TLS -> packet-up、REALITY +
#   download-settings -> stream-up、REALITY 无 download-settings -> stream-one；
# - XHTTP 关闭语义与 Mihomo 一致：应用上传 EOF / shutdown 结束整条逻辑连接，
#   同时关闭下载腿，不提供 TCP 半关闭后继续读取尾包的保证；packet-up 的待完成
#   上传最多等待 1 秒。需要完整响应的应用须在关闭前读完响应。
# - 标准 TLS 支持 skip-cert-verify/fingerprint/name-cert-verify，以及配对的
#   内联 PEM certificate/private-key；不能混用 REALITY。完整策略见 vless.md。
# - WS/gRPC/HTTP/H2 复用共享传输。WS 可 v2ray-http-upgrade 及其 fast-open；
#   gRPC 可 UA、空闲 PING、max-connections/min-streams/max-streams 池阈值。
# - smux 支持 h2mux/smux/yamux、padding/only-tcp 与池阈值；与 Vision 互斥。
# - client-fingerprint 接受 none/chrome/chrome120/firefox/firefox120/safari/safari16；
#   chrome=Chrome133，firefox=Firefox120，safari=Safari16.0；节点缺省关闭。
#   适用于标准 TCP TLS/REALITY，不改变证书 fingerprint；下载腿缺省继承、
#   显式名称覆盖、none/空串清除，转 H3/明文必须清除指纹。
#   非空 ALPS 服务端设置暂拒绝；边界见 docs/tls-client-fingerprint.md。
# - jls-opts.username/password 必须成对非空，各 1–65535 UTF-8 字节，要求 tls: true；
#   与同腿 REALITY/证书策略/mTLS、Vision/H3 互斥。下载对象缺省继承、整体替换、
#   {} 清除，主腿空对象拒绝。保持完整 TLS1.3 认证，无恢复；详见 vless.md#jls。
# - 静态 ech-opts 只用于标准 TLS，详见下方示意与 docs/vless.md#静态-ech。
#   不接受动态 query-server-name、shadow-tls-opts 或已移除的 restls-opts。
#
# 下方 vless-edge 通过 upstream-select 当前选择的 socks-hop 建链：
# 客户端 -> socks-hop -> vless-edge -> 目标。
# 所有节点支持 ip-version: dual/ipv4/ipv6/ipv4-prefer/ipv6-prefer；默认 dual。
# HTTP(S) CONNECT 示例：type: http，必填 name/server/port，tls 默认 false。
# username/password 均非空才认证；headers 为字符串映射；仅 TCP，不支持 udp: true。
# tls: true 时支持 sni/skip-cert-verify/name-cert-verify/fingerprint，
# 以及成对的内联 certificate/private-key。支持 dialer-proxy；详见 outbounds.md。
proxies:
  # TUIC v5：固定 QUIC/TLS1.3；必填 UUID 和原样 password（可空，最多 65535 UTF-8 字节）。
  # 不接受 v4、token、0-RTT、client-fingerprint、mTLS、ECH 或其他 TLS 后端选项。
  - name: tuic-edge
    type: tuic
    server: tuic.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000004
    password: "synthetic-tuic-password"
    sni: tuic.example.com # 缺省 server
    alpn: [h3] # 缺省 h3；显式 [] 拒绝，保持非空列表顺序
    skip-cert-verify: false
    # fingerprint: "<SHA-256 certificate pin, 64 hex digits>"
    # name-cert-verify: verified.example.com
    congestion-controller: cubic # cubic（默认）/new_reno/bbr
    udp: true # 缺省 false；只控制业务 UDP，QUIC 首跳始终需要数据报
    udp-relay-mode: native # native（默认）/quic
    # dialer-proxy: upstream-select # 所选上游必须实际支持双向至少 1200 字节数据报

  # Hysteria2：固定 QUIC/TLS1.3，外层总是需要 UDP；业务 UDP 默认关闭。
  # 完整字段/预算及开发验收边界见 outbounds.md#hysteria2。标准 TLS 证书策略与其他协议共用。
  - name: hysteria2-edge
    type: hysteria2
    server: hysteria2.example.com
    port: 443
    password: "synthetic-hysteria2-password"
    sni: hysteria2.example.com
    alpn: [h3] # 缺省或 [] 都归一为 h3
    skip-cert-verify: false
    # fingerprint: "<SHA-256 certificate pin, 64 hex digits>"
    # certificate/private-key: 成对内联 PEM 客户端身份
    udp: true
    up: 0 # 裸数单位 Mbps；0 自动，也可 "125 KBps"，b=bit/B=byte
    down: 0
    udp-mtu: 1197 # 单个协议分片预算；0 同默认，范围 64–65535
    # obfs: salamander
    # obfs-password: "independent-synthetic-password"
    # ports: "443,8443-8445" # 非空集合控制初始及后续入口；出现时 port 可省略
    # hop-interval: "5-7" # 仅与 ports 配套，默认 30 秒，最小 5 秒
    # dialer-proxy: upstream-select

  # VMess AEAD：alterId 仅 0；cipher 默认 auto（实际 AES 硬件检测），还支持
  # aes-128-gcm/chacha20-poly1305/none，zero 归一为 none。
  # global-padding/authenticated-length 默认 false；none/zero 不接受 true。
  # network 默认 tcp，支持 tcp/ws/grpc/http/h2。tls 默认 false；关闭时
  # 禁止 servername/alpn/fingerprint/skip-cert-verify 等 TLS 专属字段。
  # servername 优先显式值，其次 WS Host 去端口，否则 server。
  # ws-opts/grpc-opts 与下面 Trojan 的结构相同；HTTP/H2 选项见示例注释。
  # UDP 默认 false；packet-encoding 默认为空（raw），或 xudp/packetaddr。
  # raw transport 固定首包目标；packetaddr 域名由受控 Vole DNS 解析为 IP。
  # TCP/WS 保留下载侧；gRPC/HTTP/H2 上传 EOF 关闭逻辑流，详见 outbounds.md#vmess-aead。
  - name: vmess-edge
    type: vmess
    server: vmess.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000002
    alterId: 0
    cipher: auto
    network: tcp
    tls: true
    servername: vmess.example.com
    udp: true
    packet-encoding: xudp
    global-padding: false
    authenticated-length: false
    # network: http
    # http-opts:
    #   method: GET
    #   path: [/cover, /other] # 按 URL.Path 编码；缺省/空列表为 [/]
    #   headers: {Host: [cover.example:443], X-Custom: [one, two]}
    # 每次握手各选一个路径与每个头的一个值；禁止 Content-Length/Transfer-Encoding。
    # network: h2
    # h2-opts:
    #   host: [cover.example:443] # 必填、非空；每流选一个，不改变 TLS 认证名
    #   path: /cover              # 默认 /；普通 PUT body，不使用 gRPC framing

  # Trojan（outbound-trojan feature）：固定 TLS，不接受 tls 开关。
  # password 必须非空，按原始 UTF-8 字节认证，不 trim。
  # network 接受 tcp（默认）、ws、grpc。sni 默认 server，不回退 WS Host；
  # alpn 默认 tcp=[]、ws=[http/1.1]、grpc=[h2]。显式列表保留顺序，WS/gRPC
  # 必须包含适用协议并校验实际协商结果。上传 EOF 保留下载侧，直到对端结束；
  # Stop / 取消仍关闭全部会话及自有 driver，不更改 XHTTP 的全关闭约定。
  # skip-cert-verify 默认 false；fingerprint 沿用 AnyTLS 的证书 SHA-256
  # pin 语义，pin 与 skip 同时存在仍必须匹配 pin。udp 默认 false。
  # UDP 在 TLS 流内传输；单包负载最多 8192 字节并与入口预算取较小值，
  # 不拆包或截断。域名地址保持域名交由服务端处理；Mihomo v1.19.31 的
  # Trojan listener 不接收域名 UDP 帧，使用该对端时需要 IP 业务目标。
  - name: trojan-edge
    type: trojan
    server: trojan.example.com
    port: 443
    password: example-only-password
    network: tcp
    sni: trojan.example.com
    udp: true
    # network: ws
    # ws-opts:
    #   path: /edge?query=1       # 默认 /，必须绝对路径
    #   headers: {Host: cover.example:443, X-Custom: value}
    #   max-early-data: 2048    # 0–2048，默认 0
    #   early-data-header-name: Sec-WebSocket-Protocol
    #   v2ray-http-upgrade: true # 默认 false；原始流，不发送 WebSocket 帧
    #   v2ray-http-upgrade-fast-open: false # 仅 upgrade=true 可开启
    # W04>0 时头名缺省为 Sec-WebSocket-Protocol；可显式自定义头，或空字符串
    # 使用路径后缀（此时 path 不可含 query）。禁用 ED 时不接受无效的头名选项。
    # HTTPUpgrade 仅支持默认 ED 头，不接受自定义头或路径 ED；VMess 同样适用。
    # 不接受保留握手头、重复大小写头、CR/LF、userinfo 或超限 HTTP 头。
    # network: grpc
    # grpc-opts:
    #   grpc-service-name: edge # 必填；普通名映射 /edge/Tun；/ 开头使用完整路径
    # ws-opts / grpc-opts 仅可用于对应 network；不提供 gRPC 连接池。

  - name: vless-edge
    type: vless
    server: edge.example.com
    port: 443
    uuid: 00000000-0000-4000-8000-000000000001
    udp: true
    network: xhttp
    tls: true
    servername: edge.example.com
    encryption: none
    alpn: [h2]
    xhttp-opts:
      host: edge.example.com
      path: /onev
      mode: auto
      headers: {X-Transport: edge}
      # 以下范围均为字符串 N 或 N-M。所有请求字段与合法配套见 docs/xhttp.md。
      x-padding-bytes: "100-1000"
      sc-max-each-post-bytes: "1000000" # packet-up，最多16MiB，非预分配大小
      sc-min-posts-interval-ms: "30"    # packet-up，0–60000且最大值为正
      reuse-settings: # 省略无额外池；{} 启用默认池，阈值不是全节点数量上限
        max-concurrency: "0"
        max-connections: "0"
        c-max-reuse-times: "0"
        h-max-request-times: "0" # 按领取 transport，不按每 POST
        h-max-reusable-secs: "0"
        h-keep-alive-period: 0 # H2默认45秒/H3默认10秒；负数禁用；H1仅0
      # 完整覆盖示例；改成 download-settings: {} 则所有字段继承主连接。
      download-settings:
        server: download.edge.example.com
        port: 443
        tls: true
        servername: download.edge.example.com
        alpn: [h2]
        host: download.edge.example.com
        path: /onev # 与主腿汇入同一原生 handler
        headers: {} # 清除主腿自定义请求头
        reuse-settings: {} # 整体重置，不按叶继承
        skip-cert-verify: false
        fingerprint: ""     # 清除继承的 pin
        client-fingerprint: "" # 清除继承的 ClientHello profile
        name-cert-verify: "" # 恢复下载认证名
        # certificate: <inline PEM> # 与 private-key 成对；禁止文件路径
        # private-key: <inline PEM>
        # reality-opts: {} # 清除继承的 REALITY；非空对象必须提供 public-key
        # jls-opts: {} # 清除继承的 JLS；非空对象必须提供 username/password
    smux:
      enabled: false
      protocol: h2mux # h2mux/smux/yamux
      max-connections: 1 # 0–i32::MAX；正值与正 max-streams 互斥
      min-streams: 0
      max-streams: 0
      padding: false
      only-tcp: false # true 保留 packet-encoding；false 使用 sing-mux UDP
    dialer-proxy: upstream-select

  # REALITY 写法示意：在 VLESS 节点中保留 tls: true，并增加以下 mapping；不要与
  # 任何证书跳过或 fingerprint 字段组合。示例值是合法格式，不代表真实节点。
  # reality-opts:
  #   public-key: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  #   short-id: "0123"
  #   support-x25519mlkem768: false # 主腿/下载腿均可配置，必须为非 null 布尔值

  # 标准 TLS 的可选静态 ECH；主腿与 download-settings 使用相同字段。
  # 启用时 config 必填标准 Base64 ECHConfigList，不能只填写 enable。
  # 实际只协商 TLS1.3，servername 必须是 DNS 名；不查询 DNS 或自动明文回落。
  # {} 清除；不能与同腿 REALITY/JLS、Vision 混用，详细契约见 docs/vless.md#静态-ech。
  # ech-opts:
  #   enable: true
  #   config: "<server-provided Base64 ECHConfigList>"

  # SOCKS5 出站支持 CONNECT 和 UDP ASSOCIATE。username/password 必须同时省略
  # 或同时出现；tls 只能省略或为 false。udp 控制 UDP ASSOCIATE。
  - name: socks-hop
    type: socks5
    server: socks.example.com
    port: 1080
    username: user
    password: password
    udp: true

  # AnyTLS 只提供客户端出站，配置只接受以下字段和可选 dialer-proxy。
  # sni 省略时使用 server。TLS 1.3/1.2 默认 WebPKI，alpn 省略/[] 时不发送。
  # skip-cert-verify 不能覆盖 fingerprint；pin 是证书 SHA-256，不是客户端伪造指纹。
  # 叶 pin 直接决定信任；非叶 pin 作为根继续验证链和名称。所有策略均验证握手签名。
  # 不支持 REALITY、fp、ECH、mTLS 或 session/padding 调参字段，详见 outbounds.md#anytls。
  # TCP 使用 AnyTLS session；udp: true 使用 UoT v2 datagram mode。
  - name: anytls-edge
    type: anytls
    server: anytls.example.com
    port: 443
    password: "private-anytls-password"
    sni: anytls.example.com
    # alpn: [h2, http/1.1]
    skip-cert-verify: false
    # fingerprint: "<certificate SHA-256, 64 hex digits>"
    # client-fingerprint: chrome # 可选；与上方证书 pin 独立
    udp: true

  # SS 2022：cipher 精确接受下列三种；AES-128 密钥解码后 16 字节，其余为 32。
  # 2022-blake3-aes-128-gcm / 2022-blake3-aes-256-gcm /
  # 2022-blake3-chacha20-poly1305。
  # AES password 可用 iPSK1:...:iPSKn:uPSK 身份链，其他算法仅单一 Base64 PSK。
  # 以下仅为公开测试 key，不可用于真实服务。UDP 默认 false。
  # 上游 padding 风险和验收边界见 outbounds.md#shadowsocks-2022；
  # 完整互通尚未签收。dialer-proxy 可引用具体节点或 select 组。
  - name: ss-edge
    type: ss
    server: ss.example.com
    port: 8388
    cipher: 2022-blake3-aes-128-gcm
    password: "BwcHBwcHBwcHBwcHBwcHBw=="
    udp: true
    # 可选 TCP 包装，两字段必须成对。仅 strict ShadowTLS v3 / TLS1.3。
    # UoT 默认关闭。开启须 udp: true，UDP 经 SS TCP（含可选插件），不回退原生 UDP。
    # udp-over-tcp: true
    # udp-over-tcp-version: 2 # 开启时省略或整数 2；关闭时不得配置版本
    # 未启用 UoT 时，原生 SS UDP 仍单独发送，不经插件。
    # plugin: shadow-tls
    # plugin-opts:
    #   version: 3 # 必填整数，仅 3
    #   host: cover.example.com # 必填 DNS 名/IP，不是 SS 拨号地址
    #   password: "independent-shadowtls-password" # 必填 1–65535 UTF-8 字节，不 trim
    #   alpn: [h2, http/1.1] # 缺省同此，[] 不发送；每项 1–255 字节
    #   skip-cert-verify: false
    #   fingerprint: "<SHA-256 certificate pin, 64 hex digits>"
    #   name-cert-verify: verified.example.com # 可选独立证书验证名
    # client-fingerprint: chrome # 仅有插件时允许；共享七值，缺省/none/空串关闭命名模板

# select/url-test/fallback 组支持静态 proxies 与动态 use；include-all 同时包含静态节点和所有 providers，
# 也可分别使用 include-all-proxies / include-all-providers。后者启用时忽略 use。
# filter 筛选动态成员；exclude-filter / exclude-type 同时排除显式成员。
# 正则支持 Rust regex 子集，区分大小写；反引号分隔的多表达式按匹配顺序排列。
# lookaround/backreference 明确拒绝。静态成员保留顺序与重复项。
# 动态组为空时使用 empty-fallback（缺省 COMPATIBLE，即 DIRECT），可指定节点或内置目标。
# disable-udp 缺省 false；true 拒绝通过该组的业务 UDP。hidden/icon 为 Controller 元数据。
# 节点与组的完整混合图必须无环。资源更新后保留仍存在的当前选择，否则使用默认/首成员。
# 未显式定义 GLOBAL 时，自动追加一个 select 组；成员依次为 DIRECT、REJECT、
# 所有节点和声明的组，默认 DIRECT。可显式声明 GLOBAL 覆盖其成员及初始选择。
#
# select 的 default-selected 省略时选中第一项；有效缓存选择优先。名称精确匹配。
# url-test 按 URL 探测延迟选择，tolerance（毫秒，默认 0）抑制小幅切换；fallback
# 按声明顺序选择首个健康成员，恢复后可回到前面的成员。全部失败时返回首成员。
# 三种组均接受 url/interval/timeout/lazy/expected-status/max-failed-times。
# url 缺省使用首个 provider 的健康 URL，否则 https://www.gstatic.com/generate_204。
# interval 单位秒，自动组缺省/0 为 300；select 缺省 0，不主动周期探测。
# timeout 单位毫秒，缺省/0 为 5000；lazy 默认 true，无近期使用时跳过周期探测。
# expected-status 省略/空/* 接受所有最终 HTTP 状态，可用 200/204 或 200-299。
# max-failed-times 缺省/0 为 5，建链失败达到阈值后触发探测，不重试同一次业务连接。
# HTTP 探测结果不代表 UDP 可用性，业务 UDP 仍检查节点能力与 disable-udp。
# Controller 可手动固定自动组成员，成员不可用时恢复自动选择。
# 自动或手动切换只影响新连接；既有连接、认证会话及其中复用的流仍保留原路径。
# 组作为 dialer-proxy 时，与路由共用当前选择，但不重新执行业务规则；DIRECT 连接
# 当前节点的服务器而不是业务目标，REJECT 在建链时失败且不回退。单次建链对每个组
# 只读一次选择，SOCKS5 UDP 控制流与 relay 路径共用该快照和期限；不同组没有原子
# 快照保证。复用旧 AnyTLS 会话的新业务流仍沿用该会话路径，只有新建底层 transport
# 才读取新选择。Hysteria2/TUIC 已建立会话的新逻辑流、Hysteria2 跳端口 socket
# 同样沿用初始上游快照，只有新建物理会话读取新选择。业务节点的 udp 开关不阻止
# 上游通过 TCP 承载封装后的 UDP，也不替代 TUIC/Hysteria2 首跳的数据报能力检查。
proxy-groups:
  - name: upstream-select
    type: select
    proxies: [socks-hop, DIRECT, REJECT]

  - name: fallback-select
    type: select
    proxies: [socks-hop, DIRECT]

  - name: main-select
    type: select
    proxies: [vless-edge, fallback-select, DIRECT, REJECT, vless-edge]
    default-selected: vless-edge

# 资源声明及使用示例。http 支持 HTTP(S)，file 读取本地文件，inline 使用 payload。
# path 必须位于 dataDir 内；HTTP 缺省路径在 proxies/ 或 rules/ 下按 URL 分配。
# HTTP interval 单位秒，0 只获取一次；file 监测文件变化。下载失败退避重试。
# proxy 指定当前运行配置中的出口；缺省按规则选路。不会等待新资源才能建立下载连接。
# header 值为字符串数组；size-limit 单位字节，0 不设下载上限，解析仍有容量边界。
# proxy provider 文件为 {proxies: [...]}；可用 filter/exclude-filter/exclude-type。
# override 支持 udp、udp-over-tcp、up/down、dialer-proxy、skip-cert-verify、
# additional-prefix/suffix、proxy-name: [{pattern: '表达式', target: '替换文本'}]；
# 协议专属覆盖只用于支持该字段的节点。未实现的覆盖字段严格拒绝。
# proxy providers 的 health-check 接受 enable/url/interval/timeout/lazy/expected-status；
# enable 默认 false，开启后 interval 缺省/0 为 300 秒。空 URL 不发起探测。
# 相同节点/URL 的检查共享结果，每批最多 10 个并发，超时与停止均取消 I/O。
# 更新先解析并校验整个依赖图，成功才替换；失败保留旧配置与 HTTP 缓存。
# 新连接使用新资源，旧 TCP/UDP 会话保留原资源；停止等待下载、解析和资源释放。
# rule providers 支持 domain/ipcidr/classical，format 为 yaml/text/mrs；MRS 仅 domain/ipcidr。
# YAML 规则文件为 {payload: [...]}，text 每行一条，支持空行和 # 注释。
# classical 接受已支持的无动作规则，不接受 MATCH、RULE-SET、SUB-RULE。
# 文本/MRS 解压上限 64 MiB；YAML 沿用 8 MiB 输入和 32 MiB 展开预算。
proxy-providers:
  local-nodes:
    type: inline
    payload: []
    health-check:
      enable: false
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: "204"
rule-providers:
  local-domains:
    type: inline
    behavior: domain
    payload: ["+.internal.example"]
# 动态组写法：{name: automatic-members, type: select, use: [local-nodes]}
# 规则写法：RULE-SET,local-domains,DIRECT；ipcidr/classical 可追加 no-resolve。
# DNS policy 支持 rule-set:local-domains（逗号分隔多个集合）；只接受 domain/classical，
# classical 在 DNS 场景仅使用域名与 GeoSite 条件。

# hosts 支持单 IP、IP 数组、域名别名与 Clash 域名通配；不支持动态 lan 展开。
hosts:
  "internal.example": [192.0.2.10]
  "alias.example": internal.example

# DNS 的 enable、ipv6 默认 false，use-hosts/use-system-hosts 默认 true。
# enable 关闭时不接管 TUN DNS，内部解析使用系统 resolver；配置中的 hosts 仍可用于内部解析。
# enable 开启时使用配置的 resolver，不因上游失败回退到系统 DNS。
# nameserver 默认 [https://doh.pub/dns-query, tls://223.5.5.5:853]，不能显式留空。
# 支持裸 IP、UDP/TCP、tls://、http(s)://，允许上游域名；DoH 使用 HTTP/1.1 POST，
# DoT 与 HTTPS 校验证书与名称。default-nameserver 只接受 IP 上游，用于 bootstrap。
# 无 fragment 时默认 DIRECT；respect-rules: true 时默认 RULES，且必须配置
# proxy-server-nameserver。显式 fragment 可选 DIRECT、RULES 或已配置的节点/组名；
# 名称支持百分号编码。proxy-server-nameserver 专门解析节点，direct-nameserver
# 专门解析 DIRECT 业务目标；未配置时复用 nameserver。两者不隐式开启 respect-rules。
# direct-nameserver-follow-policy 默认 false；true 让直连解析遵循 nameserver-policy。
# 新建 DNS 连接采用当前组选择，cache 和已有连接不随选择改变而清空。
# nameserver-policy 接受域名、Clash 通配域名和 geosite；值为单个 nameserver 字符串
# 或非空数组。域名可用逗号连接；* 匹配一层，.example.com 仅匹配子域，
# +.example.com 匹配本域及所有子域。连续域名项优先匹配字面标签，其次 *，最后 .；
# 相同归一域名模式以后项为准。GeoSite 项隔开域名区块，区块与 GeoSite 按声明顺序匹配。
# `geosite:<selector>[,<selector>...]` 的逗号项为 OR，selector 可为 cn、cn@ads@cn、
# !cn@ads；多个属性为 key 存在性 AND（忽略 bool/int 值），前置 ! 取反整个匹配结果，
# @!cn 是字面 key。资产不可用不因反选变成全匹配。命中后仅使用当前策略的上游。
dns:
  enable: true
  ipv6: true
  fallback: [] # A/AAAA 的备用解析组；不是 nameserver 内部的故障转移
  fallback-lazy-query: false # false：与主组同时查询；true：确定需要时才查询
  fallback-filter:
    geoip: true # 非本地地址且不属于 geoip-code 时使用 fallback
    geoip-code: CN
    ipcidr: [] # 任意返回地址命中时使用 fallback
    domain: [] # Clash 域名通配，匹配后只查询 fallback
    geosite: [] # 共用 GeoData，匹配后只查询 fallback
  enhanced-mode: redir-host # 或 fake-ip；内部节点/直连解析始终取得真实地址
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: "" # 设置 IPv6 CIDR 且启用 IPv6 后分配 AAAA
  fake-ip-ttl: 1 # 秒，最小 1；不决定映射寿命
  fake-ip-filter-mode: blacklist # blacklist / whitelist / rule
  fake-ip-filter: [dns.msftnsci.com, www.msftnsci.com, www.msftconnecttest.com]
  # blacklist：命中返回真实地址；whitelist：只有命中才分配 fake-IP。
  # 普通过滤项支持 Clash 域名通配、geosite: 和 rule-set:。
  # rule：使用 DOMAIN-SUFFIX,example.com,real-ip 等域名规则；动作 real-ip/fake-ip。
  # rule 未命中分配 fake-IP；两种地址池均保留网络地址后的前三个地址及广播地址。
  use-hosts: true
  use-system-hosts: true
  respect-rules: false
  default-nameserver: [114.114.114.114, 223.5.5.5, 8.8.8.8, 1.0.0.1]
  proxy-server-nameserver: [223.5.5.5]
  proxy-server-nameserver-policy:
    "+.internal.example": 192.0.2.53
  direct-nameserver: [223.5.5.5]
  direct-nameserver-follow-policy: true
  nameserver:
    - "tcp://1.1.1.1:53#main-select"
  nameserver-policy:
    "internal.example": "223.5.5.5"
    "+.example.com": ["tcp://1.1.1.1:53#DIRECT"]
    "geosite:private,cn,apple":
      - "tcp://223.5.5.5:53#DIRECT"
      - "tcp://1.1.1.1:53#main-select"

# rules 可省略或为空；rule 模式按顺序首条命中，未命中 DIRECT。MATCH 可放在任意
# 位置，命中后其后规则不再执行。DIRECT、REJECT 是内置动作，其他动作精确引用节点或组。
# 支持 DOMAIN、DOMAIN-SUFFIX、DOMAIN-KEYWORD、DOMAIN-WILDCARD、DOMAIN-REGEX、
# GEOSITE、GEOIP、IP-CIDR、IP-CIDR6、SRC-IP-CIDR、DST-PORT、SRC-PORT、NETWORK、
# RULE-SET、AND/OR/NOT 和 MATCH。SRC-IP-CIDR 支持 IPv4/IPv6，来源信息来自实际入站会话。
# 通配符 * 匹配任意长度、? 匹配一个字符；DOMAIN-REGEX 忽略大小写，支持 regex crate
# 子集，不支持 lookaround/backreference，无法编译的模式明确报错。
# 逻辑规则例如 AND,((DOMAIN-SUFFIX,example.com),(SRC-PORT,1000-2000)),DIRECT；
# NOT 恰好一个子规则，最多嵌套 32 层。规则上限 65536 条、单条 16 KiB、合计 8 MiB。
# GEOSITE 支持 [!]<code>[@<attr>...]，GEOIP 支持 [!]<code> 和可选 no-resolve。
# 例如 GEOSITE,google@ads,REJECT / GEOSITE,!cn@ads,main-select / GEOIP,!CN,DIRECT。
# geolocation-!cn 为字面分类名；GeoIP DAT reverse_match 接受但忽略，取反由 ! 控制。
# GEOSITE 没有域名不匹配；分类缺失不匹配，而有效空属性交集的反选匹配非空域名。
rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - DOMAIN-SUFFIX,anytls.example,anytls-edge
  - NETWORK,UDP,anytls-edge
  - MATCH,main-select

# measureDelay 使用独立的 node-only 配置：顶层只能包含 proxies，不能包含
# proxy-groups。节点字段和代理图校验与上文一致，但不能出现 mixed-port/authentication、
# tun、sniffer、Controller、DNS、rules 或 GeoData；此接口的 dialer-proxy 只能引用具体
# 节点。Vole 从“未被任何 dialer-proxy 引用”的节点推导唯一链头，且该链必须覆盖
# 全部节点。测速不创建监听器、公共实例、TUN/protect 租约、DNS、规则引擎、代理组
# 或 GeoData 注册。
#
# 最小测速示例：
# proxies:
#   - name: exit
#     type: anytls
#     server: anytls.example.com
#     port: 443
#     password: secret
