[package]
name = "vole-netstack"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Bounded userspace IPv4/IPv6 TCP and UDP netstack for Vole"

[dependencies]
bytes = "1"
futures-util = "0.3"
# Upstream recovery fixes preserve retries when bounded packet output is full.
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp", rev = "24bda3b4f982625d8453d4360172557d24921c76", default-features = false, features = [
    "std",
    "medium-ip",
    "auto-icmp-echo-reply",
    "proto-ipv4",
    "proto-ipv6",
    "socket-tcp",
    "socket-tcp-cubic",
] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
